services:
  - type: worker
    name: sharkbonus
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: /var/data/sharkbonus.db
    disk:
      name: sharkbonus-data
      mountPath: /var/data
      sizeGB: 1
